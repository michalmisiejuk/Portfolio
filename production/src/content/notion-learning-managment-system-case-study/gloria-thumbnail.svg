<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Gloria LMS case study</title>
  <desc id="desc">A centered three-stage visual for the Gloria LMS case study.</desc>
  <rect width="1200" height="1000" fill="#0b1b4d"/>
  <circle cx="96" cy="90" r="18" fill="#ff5b4d"/>
  <text x="600" y="132" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700" text-anchor="middle" letter-spacing="6">GLORIA LMS</text>
  <text x="600" y="188" fill="#a9b9df" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="5">ANALYSIS / REQUIREMENTS / MVP</text>

  <line x1="188" y1="530" x2="1012" y2="530" stroke="#3f527f" stroke-width="10" stroke-linecap="round"/>
  <path d="M378 530h52M410 502l32 28-32 28M768 530h52M800 502l32 28-32 28" fill="none" stroke="#7185b2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(72 360)">
    <rect width="300" height="340" rx="30" fill="#ffffff"/>
    <rect width="300" height="22" rx="11" fill="#eb526d"/>
    <circle cx="150" cy="150" r="66" fill="#fff0f3"/>
    <text x="150" y="175" fill="#eb526d" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="700" text-anchor="middle">01</text>
    <text x="150" y="260" fill="#0b1b4d" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">PROBLEM</text>
    <text x="150" y="304" fill="#6c7da0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="2">SCATTERED TOOLS</text>
  </g>

  <g transform="translate(450 360)">
    <rect width="300" height="340" rx="30" fill="#ffffff"/>
    <rect width="300" height="22" rx="11" fill="#7659e8"/>
    <circle cx="150" cy="150" r="66" fill="#f0edff"/>
    <text x="150" y="175" fill="#7659e8" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="700" text-anchor="middle">02</text>
    <text x="150" y="260" fill="#0b1b4d" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">SYSTEM</text>
    <text x="150" y="304" fill="#6c7da0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="2">REQUIREMENTS</text>
  </g>

  <g transform="translate(828 360)">
    <rect width="300" height="340" rx="30" fill="#ffffff"/>
    <rect width="300" height="22" rx="11" fill="#12a88f"/>
    <circle cx="150" cy="150" r="66" fill="#e9faf6"/>
    <text x="150" y="175" fill="#12a88f" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="700" text-anchor="middle">03</text>
    <text x="150" y="260" fill="#0b1b4d" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">MVP</text>
    <text x="150" y="304" fill="#6c7da0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="2">TESTABLE FLOW</text>
  </g>

  <rect x="330" y="820" width="540" height="76" rx="38" fill="#ffffff"/>
  <text x="600" y="869" fill="#0b1b4d" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" letter-spacing="2">ONE COURSE LIFECYCLE</text>
</svg>
