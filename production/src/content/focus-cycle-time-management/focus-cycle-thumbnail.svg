  <rect width="1200" height="1000" fill="#f2f7fc"/>
  <text x="600" y="112" fill="#0b1b4d" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle" letter-spacing="6">FOCUS CYCLE</text>
  <rect x="454" y="152" width="292" height="62" rx="18" fill="#ffffff" stroke="#dce5f1" stroke-width="4"/>
  <text x="600" y="192" fill="#31517e" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Pomodoro MVP</text>

  <circle cx="600" cy="520" r="270" fill="#f8fbff" stroke="#dce5f1" stroke-width="28"/>
