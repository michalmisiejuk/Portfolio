<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Focus Cycle time management app</title>
  <desc id="desc">A calm dashboard with a focus timer and task list.</desc>
  <rect width="1200" height="800" fill="#f4f1eb"/>
  <rect x="84" y="78" width="1032" height="644" rx="28" fill="#fffdf9" stroke="#ded8ce" stroke-width="3"/>
